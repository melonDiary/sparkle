name: Checks

# Reusable so the release pipelines can gate their builds on these checks.
# Master pushes are covered by the Rolling pipeline, which calls this workflow,
# so listing master here as well would only run everything twice.
on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # All three platforms matter here: the tests cover platform-specific
    # branches (unix socket vs named pipe, `which` vs `where`, autostart
    # paths), and a Linux-only job previously hid a test file that only
    # failed on Windows. macOS adds darwin branches (osascript, TUN device
    # naming) that neither other runner exercises.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Must run before setup-node so the pnpm cache can be resolved. It also
      # honors the packageManager field, keeping CI on the pinned pnpm version.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      # None of these checks need the Electron binary or the native rebuild run
      # by the postinstall scripts. Note that requiring 'electron' at runtime
      # triggers a binary download, so a check that does that would need the
      # scripts enabled here.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
